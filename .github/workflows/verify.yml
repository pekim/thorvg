name: verify
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: install x11
        run: sudo apt install -y libx11-dev libxcursor-dev libxrandr-dev libgl-dev libxinerama-dev libxi-dev

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
          verify: false

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: install clang
        if: ${{ runner.os == 'macOS' }}
        run: brew install llvm # required so that libomp.dylib is available

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: test
        run: go test -v github.com/pekim/thorvg
